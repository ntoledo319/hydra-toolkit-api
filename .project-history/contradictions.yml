# Contradiction register — competing accounts preserved, not laundered.
# disagreement_kind: fact | chronology | interpretation | motive | credit | outcome
contradictions:
  - id: hydra-api-x1
    disputed_claim: Is this repository HYDRA's predecessor or a parallel variant of the Worker?
    disagreement_kind: chronology
    claim_ids: [ha-c04, ha-c08, ha-c09]
    accounts:
      - source_ids: [src-git-hydra-api, src-git-hydra-worker]
        date: 2026-03-26
        proximity: contemporaneous machine record
        says: The FastAPI root commit precedes the Worker root commit by 75 minutes and the Worker's own banner links back here as its docs.
      - source_ids: [src-git-hydra-worker, src-tc-master-portfolio]
        date: 2026-04-03
        proximity: author, eight days after the event
        says: "'Also Available: Python/FastAPI version' and, in June, 'a parallel Python/FastAPI variant for a possible RapidAPI listing' — a sibling, not an ancestor."
      - source_ids: [src-tc-registry-hydra]
        date: 2026-08-03
        proximity: agent-written, four months later
        says: "'earlier Python/FastAPI predecessor, same feature set, targeting Render, never deployed ... Superseded/shelved.'"
    best_supported_reading: >-
      Chronologically the predecessor by 75 minutes and functionally the origin of the Worker's code; strategically a parallel
      variant kept for Python readers and a marketplace listing that never materialised. "Superseded" describes the deployment
      outcome, not a decision anyone recorded.
    confidence: strongly_supported
    resolving_evidence: The authoring session logs of 2026-03-26 or an owner statement about why two implementations were made the same night.
  - id: hydra-api-x2
    disputed_claim: Was this service deployed to Render?
    disagreement_kind: outcome
    claim_ids: [ha-c03, ha-c05, ha-c11]
    accounts:
