        date: 2026-03-26
        proximity: contemporaneous
        says: render.yaml declares a free web service with autoDeploy true, which reads as an intention to run it.
      - source_ids: [src-tc-root-reports-2026-07]
        date: 2026-07-20
        proximity: owner-side planning, four months later
        says: "'hydra-api ... ship_now ... Render -> Blueprint -> connect ... 20m' — still a to-do."
      - source_ids: [src-tc-audit-2026-08, src-live-probe]
        date: 2026-08-06
        proximity: measurement
        says: hydra-toolkit-api.onrender.com returns 404 with x-render-routing no-server (also on 2026-09-04).
    best_supported_reading: >-
      Never deployed. Every dated record after the blueprint treats deployment as future work, and no probe ever found a service.
    confidence: strongly_supported
    resolving_evidence: The Render dashboard's service list and event history for the owner's account.
  - id: hydra-api-x3
