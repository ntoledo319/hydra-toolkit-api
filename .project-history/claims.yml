# Claim ledger — material historical claims with provenance.
# evidence_type: direct | contemporaneous | retrospective | behavioral | inferred
# status: verified | reported | inferred | disputed | unknown
# confidence: confirmed | strongly_supported | plausible | speculative | unknown
# Times in locators are UTC unless marked EDT (UTC-4, the author's commit timezone).
claims:
  - claim_id: ha-c01
    claim: >-
      The repository began on 2026-03-26 at 05:13:09Z (01:13 EDT) with a single 437-line FastAPI file
      exposing 26 routes (24 utilities plus / and /health), a 31-line README and three pinned dependencies;
      the GitHub repository was created two seconds later.
    date: 2026-03-26
    source_ids: [src-git-hydra-api, src-gh-metadata]
    locator: "commit ff404c6030c6529b28dbc50ff7b80f1031eb7916 (main.py, README.md, requirements.txt); gh api created_at 2026-03-26T05:13:15Z"
    evidence_type: direct
    status: verified
    confidence: confirmed
    rationale: Root commit tree and GitHub creation timestamp read directly.
    caveats: The first commit imports finished work; the idea's birth is earlier and unrecorded (see ha-c14, ha-c15, ha-c23).
  - claim_id: ha-c02
    claim: >-
      Eighty-nine seconds after the root commit, a tuple-unpacking bug in the json/validate key counter was fixed,
